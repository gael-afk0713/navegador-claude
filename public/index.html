<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#262624">
<title>Navegador Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  /* Paleta inspirada no Claude Desktop: tons quentes e o laranja "Claude". */
  :root { color-scheme: dark;
    --fundo:#262624; --lateral:#1f1e1d; --painel:#30302e; --painel2:#3a3936; --borda:#3e3d39;
    --texto:#f5f4ef; --fraco:#a6a39a; --claude:#d97757; --claude-forte:#c6613f;
    --ok:#7fb069; --erro:#e5534b; --aviso:#e0b04a; --serif:"Source Serif 4", Georgia, "Times New Roman", serif; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --fundo:#faf9f5; --lateral:#f0eee6; --painel:#ffffff; --painel2:#e8e6dc; --borda:#dedbd0;
      --texto:#1f1e1d; --fraco:#73716a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto);
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif; -webkit-text-size-adjust: 100%; }
  body { display: grid; grid-template-columns: 300px 1fr; overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  a { color: inherit; text-decoration: none; }

  /* ---------- Barra lateral (como a lista de conversas do Claude) ---------- */
  aside { background: var(--lateral); border-right: 1px solid var(--borda); display: flex; flex-direction: column; min-height: 0; }
  .marca { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .marca svg { flex: none; }
  .marca .nome { font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
  .repo { display: flex; align-items: center; gap: 8px; margin: 0 12px 12px; padding: 8px 10px; border-radius: 10px;
    color: var(--fraco); font-size: 12.5px; border: 1px solid var(--borda); overflow: hidden; }
  .repo:hover { background: var(--painel); color: var(--texto); }
  .repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .secao { padding: 6px 16px; font-size: 12px; color: var(--fraco); font-weight: 500; display: flex; align-items: center; gap: 8px; }
  #ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--erro); flex: none; }
  #ponto.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(127,176,105,.18); }
  #estado { margin-left: auto; }
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 16px; -webkit-overflow-scrolling: touch; }
  .linha { padding: 8px 10px; border-radius: 10px; line-height: 1.35; }
  .linha:hover { background: var(--painel); }
  .linha .topo { display: flex; align-items: baseline; gap: 8px; }
  .acao { font-weight: 600; color: var(--claude); text-transform: capitalize; }
  .hora { color: var(--fraco); font-size: 11.5px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .det { display: block; color: var(--fraco); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .erro .acao { color: var(--erro); } .bloqueio .acao, .confirmação .acao { color: var(--aviso); }

  /* ---------- Conversa: pedidos ao Claude pela própria página ---------- */
  #nova { margin-left: 8px; border: 1px solid var(--borda); border-radius: 7px; background: transparent; color: var(--fraco);
    font: inherit; font-size: 11.5px; padding: 2px 8px; cursor: pointer; }
  #nova:hover { color: var(--texto); background: var(--painel); }
  .msg { margin: 8px 4px; padding: 10px 12px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .msg.você { background: var(--painel2); margin-left: 28px; font-size: 14px; }
  .msg.claude { font-family: var(--serif); font-size: 15.5px; padding-left: 8px; }
  .msg.erro { color: var(--erro); font-size: 13px; }
  #pensando { padding: 4px 18px 8px; color: var(--fraco); font-family: var(--serif); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #pensando svg { animation: gira 2.5s linear infinite; }
  #pensando[hidden] { display: none; }
  #pedido { display: flex; align-items: flex-end; gap: 6px; margin: 0 10px 12px; padding: 8px; background: var(--painel);
    border: 1px solid var(--borda); border-radius: 16px; }
  #pedido:focus-within { border-color: var(--claude); }
  #mensagem { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--texto);
    font: inherit; font-size: 16px; line-height: 1.35; padding: 6px 6px; max-height: 160px; }
  #mandar { flex: none; width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--claude); color: #fff;
    font-size: 17px; cursor: pointer; }
  #mandar:disabled { opacity: .4; cursor: default; }
  #mandar.parar { background: var(--painel2); color: var(--texto); }

  /* ---------- Área principal ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px 18px 18px; gap: 12px; }
  .titulo { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
  .titulo h1 { white-space: nowrap; margin: 0; font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: -.01em; }
  .titulo a { color: var(--fraco); font-size: 12.5px; }
  .titulo a:hover { color: var(--claude); }

  .janela { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--painel); border: 1px solid var(--borda);
    border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12); }
  header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--borda); min-width: 0; }
  .btn { flex: none; border: 0; border-radius: 8px; background: transparent; color: var(--fraco); font: inherit; font-size: 16px;
    height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn:hover { background: var(--painel2); color: var(--texto); }
  .btn:active { transform: scale(.97); }
  #url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid transparent; outline: 0;
    background: var(--fundo); height: 32px; padding: 0 14px; border-radius: 999px; color: var(--fraco); font: inherit; font-size: 13px; }
  #url:focus { color: var(--texto); border-color: var(--claude); }
  #controlar { color: var(--texto); border: 1px solid var(--borda); font-size: 13px; font-weight: 500; }
  #controlar.on { background: var(--claude); border-color: var(--claude); color: #fff; }

  #tela { position: relative; flex: 1; min-height: 0; background: #141413; overflow: hidden; outline: 0; }
  #tela img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #tela img:not([src]) { visibility: hidden; }
  #tela.controle { box-shadow: inset 0 0 0 2px var(--claude); touch-action: none; cursor: pointer; }
  #tela.controle, #tela.controle img { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-user-drag: none; touch-action: none; }
  /* Seta do mouse do Claude: a ponta do SVG fica exatamente em (left, top). */
  #cursor { position: absolute; pointer-events: none; z-index: 2; transition: left .06s linear, top .06s linear;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  #cursor svg { display: block; margin: -1px 0 0 -1px; }
  /* Etiqueta "Claude" logo abaixo da seta. */
  #cursor span { position: absolute; left: -2px; top: 36px; background: var(--claude); color: #fff; font-size: 13px;
    font-weight: 600; line-height: 1; padding: 4px 9px; border-radius: 7px; border: 1.5px solid #fff; white-space: nowrap; }
  #cursor[hidden] { display: none; }
  .onda { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
    border: 3px solid var(--claude); z-index: 1; animation: onda .5s ease-out forwards; }
  @keyframes onda { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
  #vazio { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; color: #a6a39a;
    font-family: var(--serif); font-size: 17px; }
  #vazio svg { margin: 0 auto; animation: gira 6s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #vazio[hidden] { display: none; }

  /* Caixa de digitação no estilo do campo de mensagem do Claude. */
  #teclado { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--painel); border: 1px solid var(--borda);
    border-radius: 16px; padding: 8px; }
  #teclado[hidden] { display: none; }
  #entrada { flex: 1 1 200px; min-width: 0; border: 0; background: transparent; color: var(--texto);
    padding: 8px 10px; font-size: 16px; outline: 0; }
  #teclado .btn { font-size: 13px; border: 1px solid var(--borda); }
  #enviar { background: var(--claude) !important; color: #fff !important; border-color: var(--claude) !important; }

  /* Pedido de permissão, como no Claude Desktop. */
  #modal { position: fixed; inset: 0; background: rgba(20,20,19,.6); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; z-index: 10; }
  #modal[hidden] { display: none; }
  .caixa { background: var(--painel); border: 1px solid var(--borda); border-radius: 18px; padding: 24px; max-width: 480px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .caixa h2 { margin: 0 0 8px; font-family: var(--serif); font-weight: 500; font-size: 21px; display: flex; align-items: center; gap: 10px; }
  .caixa p { margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: var(--fraco); word-break: break-word; }
  .botoes { display: flex; gap: 10px; justify-content: flex-end; }
  .botoes button { font: inherit; font-size: 15px; font-weight: 500; padding: 10px 18px; border-radius: 10px; cursor: pointer; }
  #nao { background: transparent; color: var(--texto); border: 1px solid var(--borda); }
  #sim { background: var(--claude); color: #fff; border: 1px solid var(--claude); }
  #sim:hover { background: var(--claude-forte); }

  /* Telas estreitas (iPad em retrato, celular): navegador em cima, atividade embaixo. */
  @media (max-width: 820px) {
    html, body { height: auto; min-height: 100vh; min-height: 100dvh; }
    body { display: flex; flex-direction: column; overflow: visible; }
    aside { order: 2; flex: 1; border-right: 0; border-top: 1px solid var(--borda); min-height: 40vh; }
    aside .marca, aside .repo { display: none; }
    main { padding: 12px 12px; }
    #tela { flex: none; aspect-ratio: 1180 / 820; }
    .janela { flex: none; }
  }
</style>
</head>
<body>

      <button id="nova" title="Começar uma conversa nova com o Claude">Nova</button></div>

<script>
const $ = (id) => document.getElementById(id);
let ws, urlFrame, fila = [];

function linha(l) {
  const el = document.createElement('div');
  if (l.chat) {
    el.className = 'msg ' + l.chat;
    el.textContent = l.texto;
    el.title = new Date(l.hora).toLocaleTimeString('pt-BR');
    const log = $('log');
    log.appendChild(el);
    while (log.children.length > 300) log.firstChild.remove();
    log.scrollTop = log.scrollHeight; // mensagens sempre aparecem
    return;
  }
  el.className = 'linha ' + l.acao;
  const hora = new Date(l.hora).toLocaleTimeString('pt-BR');
  el.innerHTML = '<div class="topo"><span class="acao"></span><span class="hora"></span></div><span class="det"></span>';
  el.querySelector('.hora').textContent = hora;
  el.querySelector('.acao').textContent = l.acao;
  el.querySelector('.det').textContent = l.detalhe;
  el.title = l.detalhe;
  const log = $('log');
  const noFim = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
  log.appendChild(el);
  while (log.children.length > 300) log.firstChild.remove();
  if (noFim) log.scrollTop = log.scrollHeight;
}

function mostrarModal() {
  const c = fila[0];
  $('modal').hidden = !c;
  if (c) $('motivo').textContent = c.motivo;
}
function responder(aprovado) {
  const c = fila[0];
  if (c) ws.send(JSON.stringify({ tipo: 'resposta', id: c.id, aprovado }));
}
$('sim').onclick = () => responder(true);
$('nao').onclick = () => responder(false);

// Ponto do navegador (1180×820) → posição dentro de #tela, descontando as faixas do object-fit: contain.
let ultimoCursor = null;
function posicionar(el, x, y) {
  const t = $('tela'), w = t.clientWidth, h = t.clientHeight;
  const escala = Math.min(w / 1180, h / 820);
  el.style.left = (w - 1180 * escala) / 2 + x * escala + 'px';
  el.style.top = (h - 820 * escala) / 2 + y * escala + 'px';
}
window.addEventListener('resize', () => ultimoCursor && posicionar($('cursor'), ultimoCursor.x, ultimoCursor.y));

function conectar() {
  if (ws && ws.readyState <= 1) return;
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws' + location.search);
  ws.binaryType = 'blob';
  ws.onopen = () => { $('ponto').className = 'on'; $('estado').textContent = 'ao vivo'; };
  ws.onclose = () => { $('ponto').className = ''; $('estado').textContent = 'reconectando…'; fila = []; mostrarModal(); setTimeout(conectar, 1500); };
  ws.onmessage = (ev) => {
    if (ev.data instanceof Blob) {
      const antigo = urlFrame;
      urlFrame = URL.createObjectURL(ev.data);
      $('img').src = urlFrame;
      $('vazio').hidden = true;
      if (antigo) setTimeout(() => URL.revokeObjectURL(antigo), 1000);
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.tipo === 'historico') { $('log').innerHTML = ''; m.linhas.forEach(linha); }
    else if (m.tipo === 'log') linha(m.linha);
    else if (m.tipo === 'url') { if (document.activeElement !== $('url')) $('url').value = m.url; }
    else if (m.tipo === 'confirmar') { if (!fila.some((c) => c.id === m.id)) fila.push(m); mostrarModal(); }
    else if (m.tipo === 'cursor') {
      ultimoCursor = m;
      posicionar($('cursor'), m.x, m.y);
      $('cursor').hidden = false;
    }
    else if (m.tipo === 'clique') {
      const o = document.createElement('div');
      o.className = 'onda';
      posicionar(o, m.x, m.y);
      $('tela').appendChild(o);
      setTimeout(() => o.remove(), 600);
    }
    else if (m.tipo === 'confirmado') { fila = fila.filter((c) => c.id !== m.id); mostrarModal(); }
    else if (m.tipo === 'chat-estado') { ocupado = m.ocupado; atualizarPedido(); }
  };
}

// ---------- Conversa com o Claude ----------
let ocupado = false;
const enviar = (obj) => ws && ws.readyState === 1 && ws.send(JSON.stringify(obj));
function atualizarPedido() {
  $('pensando').hidden = !ocupado;
  $('mandar').classList.toggle('parar', ocupado);
  $('mandar').textContent = ocupado ? '■' : '↑';
  $('mandar').title = ocupado ? 'Parar' : 'Enviar';
  $('mandar').disabled = !ocupado && !$('mensagem').value.trim();
  $('nova').disabled = ocupado;
  if (ocupado) $('log').scrollTop = $('log').scrollHeight;
}
function ajustarAltura() {
  const m = $('mensagem');
  m.style.height = 'auto';
  m.style.height = m.scrollHeight + 'px';
}
$('pedido').addEventListener('submit', (e) => {
  e.preventDefault();
  if (ocupado) return enviar({ tipo: 'parar' });
  const texto = $('mensagem').value.trim();
  if (!texto || !enviar({ tipo: 'pedido', texto })) return;
  $('mensagem').value = '';
  ajustarAltura();
  atualizarPedido();
});
$('mensagem').addEventListener('input', () => { ajustarAltura(); atualizarPedido(); });
// Enter envia; Shift+Enter quebra a linha.
$('mensagem').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !ocupado) {
    e.preventDefault();
    $('pedido').requestSubmit();
  }
});
$('nova').onclick = () => enviar({ tipo: 'nova-conversa' });
// ---------- Controle manual ----------
let controlando = false;
const controle = (acao) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ tipo: 'controle', acao }));

$('controlar').onclick = () => {
  controlando = !controlando;
  $('controlar').classList.toggle('on', controlando);
  $('tela').classList.toggle('controle', controlando);
  $('teclado').hidden = !controlando;
  if (controlando) $('tela').focus();
};
$('voltar').onclick = () => controle({ tipo: 'voltar' });
$('avancar').onclick = () => controle({ tipo: 'avancar' });
$('recarregar').onclick = () => controle({ tipo: 'recarregar' });
$('url').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  controle({ tipo: 'abrir', url: $('url').value });
  $('url').blur();
});
$('url').addEventListener('focus', () => $('url').select());

function enviarEntrada() {
  const t = $('entrada').value;
  if (t) controle({ tipo: 'texto', texto: t });
  $('entrada').value = '';
}
$('enviar').onclick = enviarEntrada;
$('entrada').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  enviarEntrada();
  controle({ tipo: 'tecla', tecla: 'Enter' });
});
document.querySelectorAll('[data-tecla]').forEach((b) => {
  b.onclick = () => controle({ tipo: 'tecla', tecla: b.dataset.tecla });
});

// Converte um ponto na tela do iPad/PC para coordenadas do navegador (a imagem usa object-fit: contain).
function coordenadas(ev) {
  const img = $('img');
  if (!img.naturalWidth) return null;
  const r = img.getBoundingClientRect();
  const escala = Math.min(r.width / img.naturalWidth, r.height / img.naturalHeight);
  const x = (ev.clientX - r.left - (r.width - img.naturalWidth * escala) / 2) / escala;
  const y = (ev.clientY - r.top - (r.height - img.naturalHeight * escala) / 2) / escala;
  if (x < 0 || y < 0 || x > img.naturalWidth || y > img.naturalHeight) return null;
  return { x, y, escala };
}

// Toque/clique simples = clique; arrastar = rolar (como no iPad).
let toque = null;
const tela = $('tela');
tela.addEventListener('pointerdown', (e) => {
  if (!controlando) return;
  e.preventDefault();
  tela.focus();
  toque = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, arrastou: false, id: e.pointerId };
  tela.setPointerCapture(e.pointerId);
});
tela.addEventListener('pointermove', (e) => {
  if (!toque || e.pointerId !== toque.id) return;
  if (Math.hypot(e.clientX - toque.x0, e.clientY - toque.y0) > 8) toque.arrastou = true;
  if (!toque.arrastou) return;
  const c = coordenadas(e);
  const escala = c ? c.escala : 1;
  rolar((toque.x - e.clientX) / escala, (toque.y - e.clientY) / escala, c);
  toque.x = e.clientX; toque.y = e.clientY;
});
tela.addEventListener('pointerup', (e) => {
  if (!toque || e.pointerId !== toque.id) return;
  if (!toque.arrastou) {
    const c = coordenadas(e);
    if (c) controle({ tipo: 'clique', x: c.x, y: c.y });
  }
  toque = null;
});
tela.addEventListener('pointercancel', () => { toque = null; });
tela.addEventListener('wheel', (e) => {
  if (!controlando) return;
  e.preventDefault();
  rolar(e.deltaX, e.deltaY, coordenadas(e));
}, { passive: false });

// Agrupa a rolagem em pacotes a cada 60 ms para não inundar o servidor.
let rolagem = null;
function rolar(dx, dy, c) {
  if (!rolagem) {
    rolagem = { dx: 0, dy: 0, x: c?.x, y: c?.y };
    setTimeout(() => { controle({ tipo: 'rolar', ...rolagem }); rolagem = null; }, 60);
  }
  rolagem.dx += dx; rolagem.dy += dy;
}

// Teclado físico (PC ou iPad com teclado): com a tela focada, as teclas vão para o navegador.
const TECLAS = ['Enter', 'Backspace', 'Delete', 'Tab', 'Escape', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight',
  'Home', 'End', 'PageUp', 'PageDown'];
tela.addEventListener('keydown', (e) => {
  if (!controlando || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length === 1) controle({ tipo: 'texto', texto: e.key });
  else if (TECLAS.includes(e.key)) controle({ tipo: 'tecla', tecla: e.key });
  else return;
  e.preventDefault();
});

// O Safari suspende conexões em segundo plano; reconecta ao voltar.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && (!ws || ws.readyState > 1)) conectar();
});
conectar();
</script>
